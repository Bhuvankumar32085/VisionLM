project:
  name: custom-vlm
  seed: 42

vision:
  model_name: google/vit-base-patch16-224-in21k
  image_size: 224
  patch_size: 16
  hidden_size: 768
  use_cls_token: false
  freeze: true

language:
  model_name: HuggingFaceTB/SmolLM2-360M-Instruct
  freeze: true
  use_lora: false

projector:
  input_dim: 768
  hidden_dim: 1536
  output_dim: 960
  activation: gelu
  dropout: 0.0

training:
  phase: projector  # Options: 'projector' (Phase 1) or 'lora' (Phase 2)
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  precision: bf16  # Options: 'bf16', 'fp16', 'fp32'
  gradient_checkpointing: false
  num_workers: 0
  logging_steps: 10
  eval_steps: 500

data:
  train_file: data/processed/train.jsonl
  validation_file: data/processed/validation.jsonl
  max_question_length: 128
  max_answer_length: 256

checkpoint:
  directory: checkpoints
  save_every_steps: 1000
  save_best: true

inference:
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  do_sample: false
