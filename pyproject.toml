[project]
name = "custom-vlm"
version = "0.1.0"
description = "Custom Vision-Language Model built from scratch using ViT-B/16, MLP Projector, and SmolLM2-360M-Instruct"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.45.0",
    "datasets>=2.18.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "peft>=0.13.0",
    "requests>=2.31.0",
    "streamlit>=1.38.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
